<!DOCTYPE html>
<html lang="it" data-style="riviera">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Baloo+2:wght@600;700;800&family=Inter:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&family=Syne:wght@700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#139AC8; --on:#062631; --on-soft:#0E4251; --card:#fff; --ink:#0A2A35; --ink-soft:#4A6570;
  --accent:#0A4F66; --chip:rgba(255,255,255,.35); --line:#D6E7EE; --cardline:transparent; --glow:rgba(0,0,0,0);
  --shadow:0 2px 6px rgba(6,38,49,.18); --fh:'Fraunces',Georgia,serif; --fb:'Inter',system-ui,sans-serif;
}
html[data-style=elegante]{--fh:'Cormorant Garamond',Georgia,serif; --fb:'Jost',system-ui,sans-serif;}
html[data-style=lavagna]{--fh:'Caveat','Comic Sans MS',cursive; --fb:'Nunito',system-ui,sans-serif;}
html[data-style=osteria]{--fh:'Alegreya',Georgia,serif; --fb:'Alegreya Sans',system-ui,sans-serif;}
html[data-style=notte]{--fh:'Syne',system-ui,sans-serif; --fb:'Manrope',system-ui,sans-serif;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);transition:background .25s;}
body{font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--fh);font-weight:600;margin:0;}
button{font:inherit;}
.hidden{display:none !important;}

/* ================= RIVIERA (base) ================= */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:8px 0 4px;}
.medal{width:132px;height:132px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:'Fraunces',serif;font-size:15px;color:#6b7c83;line-height:1.2;text-align:center;}
.cover h1{font-size:26px;color:var(--on);}
.cover .place{font-size:13px;color:var(--on-soft);margin-top:-6px;}
.hours{background:var(--card);border:1px solid var(--cardline);border-radius:14px;padding:12px 18px;width:100%;max-width:330px;box-shadow:var(--shadow);text-align:left;}
.hours h3{font-size:14px;color:var(--accent);text-align:center;margin-bottom:6px;}
.hr{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dotted var(--line);}
.hr:last-child{border-bottom:none;} .hr span:first-child{font-weight:600;}
.pagehead{margin-bottom:14px;}
.pagehead .eyebrow{font-size:12.5px;font-weight:600;color:var(--on);}
.pagehead h2{font-size:25px;color:var(--on);line-height:1.15;}
.pagehead .sub{font-size:13px;color:var(--on-soft);margin-top:2px;}
.group-title{font-size:13px;font-weight:700;color:var(--on);margin:18px 0 6px;letter-spacing:.02em;}
.listino{background:var(--card);border:1px solid var(--cardline);border-radius:12px;padding:2px 14px;box-shadow:var(--shadow);}
.litem{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px dotted var(--line);}
.litem:last-child{border-bottom:none;}
.l-name{font-weight:700;font-size:14.5px;} .l-sub{font-size:11.5px;color:var(--ink-soft);margin-left:5px;}
.l-comp{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.l-price{font-weight:700;font-size:14px;color:var(--accent);white-space:nowrap;}
.grid{display:grid;grid-template-columns:1fr;gap:10px;}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr;}}
.card{background:var(--card);border:1px solid var(--cardline);border-left:3px solid var(--accent);border-radius:4px 10px 10px 4px;padding:11px 14px;box-shadow:var(--shadow);}
.c-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.c-name{font-weight:700;font-size:14px;} .c-price{font-weight:700;font-size:13.5px;color:var(--accent);white-space:nowrap;}
.c-origin{font-size:11px;font-weight:600;color:var(--accent);margin-top:2px;opacity:.85;}
.c-desc{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.45;}
.note{margin-top:14px;background:var(--card);border:1px dashed var(--accent);border-radius:10px;padding:9px 12px;text-align:center;font-size:12px;font-weight:600;color:var(--accent);}
.chip{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--on);background:var(--chip);border:1px solid transparent;padding:6px 13px;border-radius:20px;white-space:nowrap;cursor:pointer;}
.chip.active{background:var(--on);color:var(--bg);}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;}
.chipbar::-webkit-scrollbar{display:none;}

/* ================= ELEGANTE ================= */
[data-style=elegante] .sbody{background:#fff;padding:14px 20px;box-shadow:0 12px 30px rgba(0,0,0,.2);border-radius:2px;}
[data-style=elegante] .listino,[data-style=elegante] .card,[data-style=elegante] .hours{background:transparent;border:none;box-shadow:none;border-radius:0;}
[data-style=elegante] .listino{padding:0;}
[data-style=elegante] .litem{border-bottom:1px solid var(--line);padding:11px 0;}
[data-style=elegante] .grid{gap:0;}
[data-style=elegante] .card{padding:13px 0;border-bottom:1px solid var(--line);}
[data-style=elegante] .card:last-child{border-bottom:none;}
[data-style=elegante] .l-name,[data-style=elegante] .c-name{font-family:var(--fh);font-size:19px;font-weight:600;}
[data-style=elegante] .l-price,[data-style=elegante] .c-price{font-family:var(--fh);font-size:18px;font-weight:600;}
[data-style=elegante] .c-origin{font-style:italic;font-weight:400;opacity:1;}
[data-style=elegante] .pagehead{text-align:center;margin-bottom:18px;}
[data-style=elegante] .pagehead h2{font-size:34px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:14px;}
[data-style=elegante] .pagehead h2::before,[data-style=elegante] .pagehead h2::after{content:"";flex:0 1 48px;height:1px;background:var(--on);opacity:.55;}
[data-style=elegante] .pagehead .eyebrow{font-family:var(--fh);font-style:italic;font-weight:500;font-size:17px;}
[data-style=elegante] .group-title{font-family:var(--fh);font-style:italic;font-size:19px;font-weight:500;color:var(--accent);text-align:center;margin:14px 0 2px;}
[data-style=elegante] .note{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;font-family:var(--fh);font-style:italic;font-weight:500;font-size:16px;}
[data-style=elegante] .chip{border-radius:2px;background:transparent;border-color:var(--on);font-weight:500;}
[data-style=elegante] .medal{width:86px;height:86px;font-size:12px;box-shadow:none;border:1px solid rgba(0,0,0,.08);}
[data-style=elegante] .cover{gap:8px;}
[data-style=elegante] .cover h1{font-size:40px;font-weight:500;margin-top:6px;}
[data-style=elegante] .cover .place{font-family:var(--fh);font-style:italic;font-size:17px;margin-top:-2px;}
[data-style=elegante] .cover .rule{width:70px;height:1px;background:var(--on);opacity:.6;margin:8px 0;}
[data-style=elegante] .cover .hours{color:var(--on);padding:0;max-width:280px;}
[data-style=elegante] .cover .hours h3{color:var(--on);font-style:italic;font-weight:500;font-size:18px;}
[data-style=elegante] .cover .hr{border-bottom-color:var(--on-soft);border-bottom-style:solid;opacity:.95;}
[data-style=elegante] .tile{border-radius:2px;border-bottom:none;text-align:center;align-items:center;justify-content:center;gap:6px;}
[data-style=elegante] .tile .t{font-size:22px;font-weight:600;}
[data-style=elegante] .acc-item{background:transparent;border-radius:0;border-bottom:1px solid var(--on-soft);}
[data-style=elegante] .acc-head .t{font-size:24px;font-weight:500;}
[data-style=elegante] .acc-body{padding:0 0 16px;}

/* ================= LAVAGNA ================= */
[data-style=lavagna] body{background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px),radial-gradient(rgba(0,0,0,.05) 1px,transparent 1.3px),radial-gradient(rgba(255,255,255,.035) 1.5px,transparent 2px);
  background-size:7px 11px,13px 9px,23px 19px;background-attachment:fixed;}
[data-style=lavagna] .listino,[data-style=lavagna] .card,[data-style=lavagna] .hours,[data-style=lavagna] .note{background:transparent;box-shadow:none;
  border:2px dashed var(--line);border-radius:12px 16px 10px 18px;}
[data-style=lavagna] .litem{border-bottom:1.5px dashed var(--line);}
[data-style=lavagna] .card:nth-child(odd){transform:rotate(-.7deg);} [data-style=lavagna] .card:nth-child(even){transform:rotate(.6deg);}
[data-style=lavagna] .l-name,[data-style=lavagna] .c-name{font-family:var(--fh);font-size:24px;font-weight:700;line-height:1.05;}
[data-style=lavagna] .l-price,[data-style=lavagna] .c-price{font-family:var(--fh);font-size:24px;font-weight:700;}
[data-style=lavagna] .l-sub{font-size:12px;}
[data-style=lavagna] .pagehead h2{font-size:44px;font-weight:700;display:inline-block;transform:rotate(-1.5deg);border-bottom:3px solid var(--accent);padding:0 6px 2px 0;line-height:1;}
[data-style=lavagna] .pagehead .sub{margin-top:8px;}
[data-style=lavagna] .group-title{font-family:var(--fh);font-size:28px;color:var(--accent);letter-spacing:0;}
[data-style=lavagna] .note{font-family:var(--fh);font-size:21px;font-weight:700;}
[data-style=lavagna] .chip{background:transparent;border:1.5px dashed var(--on);font-family:var(--fh);font-size:19px;padding:1px 13px;}
[data-style=lavagna] .chip.active{border-style:solid;}
[data-style=lavagna] .cover{align-items:stretch;text-align:left;gap:16px;}
[data-style=lavagna] .cv-row{display:flex;align-items:center;gap:16px;}
[data-style=lavagna] .medal{width:96px;height:96px;background:transparent;border:2px dashed var(--on);box-shadow:none;color:var(--on);font-family:var(--fh);font-size:20px;}
[data-style=lavagna] .cover h1{font-size:52px;font-weight:700;line-height:.95;}
[data-style=lavagna] .cover .place{margin-top:4px;}
[data-style=lavagna] .cover .hours{max-width:none;color:var(--on);}
[data-style=lavagna] .hours h3{font-size:26px;text-align:left;}
[data-style=lavagna] .tile{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--on);border-radius:14px 10px 16px 12px;}
[data-style=lavagna] .tile .t{font-size:30px;font-weight:700;} [data-style=lavagna] .tile .n{color:var(--on-soft);}
[data-style=lavagna] .tile:nth-child(odd){transform:rotate(-1deg);} [data-style=lavagna] .tile:nth-child(even){transform:rotate(.8deg);}
[data-style=lavagna] .acc-item{background:transparent;border:2px dashed var(--line);}
[data-style=lavagna] .acc-head .t{font-size:30px;font-weight:700;}
[data-style=lavagna] .sect-nav button,[data-style=lavagna] .back{background:transparent;border:1.5px dashed var(--on);color:var(--on);box-shadow:none;font-family:var(--fh);font-size:19px;}

/* ================= OSTERIA ================= */
[data-style=osteria] .listino,[data-style=osteria] .card,[data-style=osteria] .hours,[data-style=osteria] .note,[data-style=osteria] .tile{
  border:4px double var(--accent);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.12);}
[data-style=osteria] .card{border-left:4px double var(--accent);}
[data-style=osteria] .l-name,[data-style=osteria] .c-name{font-family:var(--fh);font-size:17px;font-weight:700;}
[data-style=osteria] .l-price,[data-style=osteria] .c-price{font-family:var(--fh);font-size:17px;}
[data-style=osteria] .c-origin{font-style:italic;font-weight:500;}
[data-style=osteria] .pagehead{text-align:center;}
[data-style=osteria] .pagehead h2{font-size:32px;font-weight:700;}
[data-style=osteria] .pagehead h2::after{content:"";display:block;width:110px;height:8px;margin:7px auto 0;
  background:radial-gradient(circle,var(--on) 2.2px,transparent 2.6px) center/11px 8px repeat-x;}
[data-style=osteria] .pagehead .eyebrow{font-family:var(--fh);font-style:italic;font-weight:500;font-size:16px;}
[data-style=osteria] .group-title{font-family:var(--fh);font-style:italic;font-weight:500;font-size:20px;text-align:center;letter-spacing:0;}
[data-style=osteria] .note{font-family:var(--fh);font-style:italic;font-weight:500;font-size:15px;}
[data-style=osteria] .chip{border-radius:3px;font-family:var(--fh);font-weight:700;}
[data-style=osteria] .medal{width:124px;height:124px;background:var(--card);border:2px solid var(--accent);box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--on);font-family:var(--fh);font-size:15px;color:var(--ink-soft);}
[data-style=osteria] .cover h1{font-size:36px;font-weight:700;}
[data-style=osteria] .cover .place{font-family:var(--fh);font-style:italic;font-size:15px;}
[data-style=osteria] .hours h3{font-size:18px;font-style:italic;font-weight:500;}
[data-style=osteria] .tile{justify-content:center;align-items:center;text-align:center;gap:6px;}
[data-style=osteria] .tile .t{font-size:21px;font-weight:700;}
[data-style=osteria] .acc-item{border-radius:3px;}
[data-style=osteria] .acc-head .t{font-size:22px;font-weight:700;}

/* ================= NOTTE ================= */
[data-style=notte] .listino,[data-style=notte] .card,[data-style=notte] .hours,[data-style=notte] .note,[data-style=notte] .tile{
  border:1px solid var(--accent);box-shadow:0 0 14px var(--glow),inset 0 0 10px var(--glow);border-radius:14px;}
[data-style=notte] .card{border-left:1px solid var(--accent);}
[data-style=notte] .l-name,[data-style=notte] .c-name{text-transform:uppercase;letter-spacing:.05em;font-size:13.5px;}
[data-style=notte] .l-price,[data-style=notte] .c-price{font-family:var(--fh);font-size:16px;text-shadow:0 0 10px var(--glow);}
[data-style=notte] .pagehead h2{font-size:36px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 18px var(--glow);}
[data-style=notte] .pagehead .eyebrow{color:var(--accent-on-bg);}
[data-style=notte] .group-title{font-family:var(--fh);font-size:15px;text-transform:uppercase;letter-spacing:.12em;}
[data-style=notte] .chip{background:transparent;border-color:var(--on);border-radius:8px;}
[data-style=notte] .chip.active{box-shadow:0 0 12px var(--glow);}
[data-style=notte] .cover{align-items:flex-start;text-align:left;gap:14px;}
[data-style=notte] .medal{width:64px;height:64px;font-size:10px;}
[data-style=notte] .cover h1{font-size:clamp(28px,9.5vw,54px);overflow-wrap:break-word;font-weight:800;text-transform:uppercase;line-height:.92;text-shadow:0 0 22px var(--glow);margin-top:8px;}
[data-style=notte] .cover .place{margin-top:0;}
[data-style=notte] .cover .hours{max-width:340px;}
[data-style=notte] .hours h3{text-align:left;text-transform:uppercase;letter-spacing:.1em;font-size:13px;}
[data-style=notte] .tile .t{font-size:20px;font-weight:800;text-transform:uppercase;}
[data-style=notte] .tile{border-bottom:1px solid var(--accent);}
[data-style=notte] .acc-item{border:1px solid var(--accent);background:transparent;}
[data-style=notte] .acc-head .t{font-weight:800;text-transform:uppercase;font-size:18px;}
[data-style=notte] .sect-nav button,[data-style=notte] .back{border:1px solid var(--accent);}



/* ================= STRUTTURE DIVERSE PER STILE ================= */
/* --- Elegante: carta stampata, puntini fino al prezzo --- */
[data-style=elegante] .ld{padding:10px 0;}
[data-style=elegante] .ld-row{display:flex;align-items:baseline;gap:6px;}
[data-style=elegante] .ld-n{font-family:var(--fh);font-size:19px;font-weight:600;color:var(--ink);}
[data-style=elegante] .ld-n em{font-weight:500;font-size:15px;color:var(--ink-soft);}
[data-style=elegante] .ld-dots{flex:1;min-width:14px;border-bottom:2px dotted var(--ink-soft);opacity:.55;transform:translateY(-5px);}
[data-style=elegante] .ld-p{font-family:var(--fh);font-size:18px;font-weight:600;color:var(--accent);white-space:nowrap;}
[data-style=elegante] .ld-d{font-family:var(--fh);font-style:italic;font-size:15.5px;color:var(--ink-soft);margin-top:1px;line-height:1.35;}
[data-style=elegante] .sbody{padding:12px 22px 16px;}

/* --- Lavagna: cornice di legno, striscioni, prezzi cerchiati a gesso --- */
[data-style=lavagna] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:45;border:9px solid #7a4d2a;
  border-image:repeating-linear-gradient(90deg,#8a5a33 0 18px,#744826 18px 31px,#9a6a3e 31px 46px) 9;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 0 22px rgba(0,0,0,.4);}
[data-style=lavagna] .pagehead h2{border-bottom:none;padding:0;transform:rotate(-1.5deg);}
[data-style=lavagna] .scrib{display:block;width:170px;height:12px;margin:2px 0 0 2px;overflow:visible;}
[data-style=lavagna] .scrib path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;}
[data-style=lavagna] .banner{display:inline-block;margin:18px 0 8px;padding:3px 26px 5px;background:var(--on);color:var(--bg);font-family:var(--fh);
  font-size:26px;font-weight:700;line-height:1.1;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);transform:rotate(-1.5deg);}
[data-style=lavagna] .ch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 2px;}
[data-style=lavagna] .ch + .ch{border-top:1.5px dashed var(--line);}
[data-style=lavagna] .ch-n{font-family:var(--fh);font-size:26px;font-weight:700;line-height:1;color:var(--on);}
[data-style=lavagna] .ch-s{font-size:12px;color:var(--ink-soft);margin-left:4px;}
[data-style=lavagna] .ch-d{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.35;}
[data-style=lavagna] .ch-p{flex:0 0 auto;font-family:var(--fh);font-size:21px;font-weight:700;color:var(--accent);border:2px solid var(--accent);
  border-radius:52% 46% 55% 45% / 50% 55% 45% 52%;padding:5px 11px;min-width:64px;text-align:center;line-height:1.1;white-space:nowrap;transform:rotate(-4deg);}
[data-style=lavagna] .ch:nth-child(even) .ch-p{transform:rotate(3deg);}

/* --- Osteria: tovaglietta a quadretti, nastri, prezzi a timbro --- */
[data-style=osteria] body::before,[data-style=osteria] body::after{content:"";position:fixed;left:0;right:0;height:12px;z-index:45;pointer-events:none;
  background:repeating-conic-gradient(var(--accent) 0 25%,var(--card) 0 50%) 0 0/12px 12px;}
[data-style=osteria] body::before{top:0;} [data-style=osteria] body::after{bottom:0;}
[data-style=osteria] .topfix{padding-top:calc(12px + env(safe-area-inset-top,0px));}
[data-style=osteria] .botnav{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));}
[data-style=osteria] .ribbon{display:table;margin:22px auto 10px;background:var(--accent);color:var(--card);font-family:var(--fh);font-style:italic;
  font-size:19px;font-weight:500;padding:5px 32px 6px;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);}
[data-style=osteria] .paper{background:var(--card);border:4px double var(--accent);border-radius:3px;padding:2px 14px;box-shadow:0 3px 0 rgba(0,0,0,.15);}
[data-style=osteria] .os{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;}
[data-style=osteria] .os + .os{border-top:1px dashed var(--line);}
[data-style=osteria] .os-n{font-family:var(--fh);font-size:18px;font-weight:700;color:var(--ink);}
[data-style=osteria] .os-s{font-size:13px;color:var(--ink-soft);font-style:italic;margin-left:4px;}
[data-style=osteria] .os-d{font-size:13.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
[data-style=osteria] .stamp{flex:0 0 auto;min-width:58px;height:58px;padding:0 9px;border-radius:30px;border:2px solid var(--accent);
  box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4.5px var(--accent);display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap;line-height:1;transform:rotate(-8deg);}

/* --- Notte: file di schede da scorrere di lato --- */
[data-style=notte] body{background-image:radial-gradient(120% 55% at 10% 0%,var(--glow),transparent 60%);background-attachment:fixed;}
[data-style=notte] .pagehead h2{font-size:clamp(21px,6.4vw,44px);letter-spacing:0;overflow-wrap:break-word;}
[data-style=notte] .gt{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px;gap:10px;}
[data-style=notte] .gt b{font-family:var(--fh);font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--on);}
[data-style=notte] .gt span{font-size:12px;color:var(--on-soft);white-space:nowrap;}
[data-style=notte] .row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:4px 18px 16px;scrollbar-width:none;}
[data-style=notte] .row::-webkit-scrollbar{display:none;}
[data-style=notte] .nc{flex:0 0 74%;max-width:290px;scroll-snap-align:start;background:var(--card);border:1px solid var(--accent);border-radius:18px;
  padding:16px;box-shadow:0 0 16px var(--glow);display:flex;flex-direction:column;gap:7px;min-height:156px;}
[data-style=notte] .nc-n{font-family:var(--fh);font-weight:800;text-transform:uppercase;font-size:16px;overflow-wrap:break-word;line-height:1.05;color:#fff;}
[data-style=notte] .nc-s{font-size:12px;color:var(--accent);font-weight:600;}
[data-style=notte] .nc-d{font-size:13px;color:var(--ink-soft);line-height:1.4;flex:1;}
[data-style=notte] .nc-p{align-self:flex-start;background:var(--accent);color:var(--card);font-weight:800;font-family:var(--fh);font-size:15px;
  border-radius:20px;padding:4px 13px;box-shadow:0 0 14px var(--glow);}
[data-style=notte] body.m-sfoglia .row{display:grid;grid-template-columns:1fr;margin:0;padding:4px 0 8px;overflow:visible;}
[data-style=notte] body.m-sfoglia .nc{max-width:none;min-height:0;}
[data-style=notte] body.m-sfoglia .gt span{display:none;}

/* ---- correzioni comuni ---- */
html[data-style] .chip.active{background:var(--on);color:var(--bg);border-color:var(--on);border-style:solid;}
[data-style=notte] .chip.active{box-shadow:0 0 12px var(--glow);}
[data-style=lavagna] .navbtn{background:transparent;border:1.5px dashed var(--on);color:var(--on);box-shadow:none;}
/* ---- modello cliente ---- */
.medal{overflow:hidden;font-family:var(--fh);font-size:34px;font-weight:700;color:var(--accent);}
.medal img{width:100%;height:100%;object-fit:cover;display:block;}
[data-style=osteria] .medal img,[data-style=riviera] .medal img{padding:6px;border-radius:50%;background:#fff;}
.cover > *{flex-shrink:0;}
.covernote{font-size:12.5px;color:var(--on-soft);text-align:center;max-width:320px;margin:10px auto 0;line-height:1.4;}
[data-style=lavagna] .covernote,[data-style=notte] .covernote{text-align:left;margin-left:0;}
.loading{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--on);font-size:14px;text-align:center;padding:30px;}
.loading .dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--chip);border-top-color:var(--on);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* ---- foto dei prodotti ---- */
[data-foto]{cursor:pointer;-webkit-tap-highlight-color:transparent;}
[data-foto]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}
.cam{display:inline-flex;vertical-align:middle;margin-left:6px;color:var(--accent);opacity:.85;}
.cam svg{width:16px;height:16px;}
[data-style=notte] .cam,[data-style=lavagna] .cam{color:var(--accent);}
.lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(56px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));gap:12px;}
.lb[hidden]{display:none;}
.lb img{max-width:100%;max-height:62dvh;border-radius:14px;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#222;}
.lb .cap{background:#fff;color:#1b2429;border-radius:14px;padding:12px 16px;width:100%;max-width:480px;font-family:var(--fb);}
.lb .cap .t{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:16px;}
.lb .cap .t b{font-family:var(--fh);}
.lb .cap .d{font-size:13.5px;color:#55656c;margin-top:4px;line-height:1.45;}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:40px;height:40px;border-radius:50%;border:none;background:#fff;color:#1b2429;font-size:22px;line-height:1;cursor:pointer;}
.lb .miss{color:#fff;font-size:14px;}
/* ================= modi di navigazione ================= */
.m-sfoglia .book{display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;}
.m-sfoglia .book::-webkit-scrollbar{display:none;}
.m-sfoglia .page{flex:0 0 100vw;height:100dvh;scroll-snap-align:start;overflow-y:auto;padding:calc(66px + env(safe-area-inset-top,0px)) 20px 100px 34px;position:relative;}
.m-sfoglia .page::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:1px;background-image:linear-gradient(var(--on) 60%,transparent 0);background-size:1px 10px;opacity:.35;}
.m-sfoglia .page .cover{min-height:calc(100dvh - 180px);justify-content:center;}
.topfix{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--bg) 72%,transparent);}
.botnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)) 36px;background:linear-gradient(transparent,var(--bg) 35%);}
.navbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--card);color:var(--accent);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.navbtn[disabled]{opacity:.35;}
.navbtn svg{width:18px;height:18px;}
.pinfo{text-align:center;font-size:12px;color:var(--on);} .pinfo b{display:block;font-family:var(--fh);font-size:14px;}
.m-scroll .flow{padding:calc(62px + env(safe-area-inset-top,0px)) 18px 110px;max-width:760px;margin:0 auto;}
.m-scroll .flow section{scroll-margin-top:calc(64px + env(safe-area-inset-top,0px));padding-top:26px;}
.m-scroll .flow section:first-child{padding-top:6px;}
.m-schede .acc{padding:calc(20px + env(safe-area-inset-top,0px)) 16px 110px;max-width:760px;margin:0 auto;}
.acc-cover{margin-bottom:18px;}
.acc-item{margin-bottom:10px;border-radius:14px;overflow:hidden;background:var(--chip);}
.acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;border:none;background:transparent;color:var(--on);padding:14px 16px;cursor:pointer;text-align:left;}
.acc-head .t{font-family:var(--fh);font-size:19px;}
.acc-head .n{font-size:12px;opacity:.8;margin-right:10px;}
.acc-head svg{width:18px;height:18px;transition:transform .2s;}
.acc-item.open .acc-head svg{transform:rotate(180deg);}
.acc-body{padding:0 12px 14px;}
.m-tessere .tiles-wrap,.m-tessere .sect-view{padding:calc(20px + env(safe-area-inset-top,0px)) 16px 110px;max-width:760px;margin:0 auto;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.tile{border:none;border-radius:16px;background:var(--card);box-shadow:var(--shadow);padding:18px 14px 14px;text-align:left;cursor:pointer;min-height:104px;
  display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);border-bottom:4px solid var(--accent);}
.tile .t{font-family:var(--fh);font-size:19px;line-height:1.15;}
.tile .n{font-size:12px;color:var(--ink-soft);}
.back{border:none;background:var(--chip);color:var(--on);border-radius:20px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;margin-bottom:14px;}
.sect-nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
.sect-nav button{flex:1;border:none;background:var(--card);color:var(--accent);border-radius:12px;padding:11px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);}
.sect-nav button[disabled]{visibility:hidden;}

/* ================= pannello prova (solo demo) ================= */
.demo-btn{position:fixed;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;width:46px;height:46px;border-radius:50%;border:none;
  background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.25);font-size:22px;cursor:pointer;}
body.m-sfoglia .demo-btn{bottom:calc(84px + env(safe-area-inset-bottom,0px));}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;color:#1b2429;border-radius:20px 20px 0 0;max-height:88dvh;overflow-y:auto;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(0,0,0,.25);max-width:560px;margin:0 auto;
  transform:translateY(105%);transition:transform .25s;font-family:'Inter',sans-serif;}
.sheet.open{transform:none;}
.sheet h4{margin:0 0 8px;font-size:14px;}
.sheet .row{margin-bottom:16px;}
.pick{display:flex;align-items:center;gap:12px;}
.pick input[type=color]{width:56px;height:44px;border:none;border-radius:10px;padding:0;background:none;cursor:pointer;}
.pick .hex{font-size:13px;color:#555;}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccd;cursor:pointer;}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.seg button{border:1px solid #cfd8dc;background:#f5f8f9;border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer;color:#1b2429;}
.seg button b{display:block;font-size:13.5px;} .seg button span{font-size:11.5px;color:#61737a;}
.seg button.on{border-color:#1b2429;background:#1b2429;color:#fff;} .seg button.on span{color:#cfd8dc;}
.styles{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.styles button{flex:0 0 auto;border:1px solid #cfd8dc;background:#f5f8f9;border-radius:12px;padding:9px 13px;cursor:pointer;color:#1b2429;font-size:15px;}
.styles button.on{background:#1b2429;color:#fff;border-color:#1b2429;}
.sheet .close{width:100%;border:none;background:#1b2429;color:#fff;border-radius:12px;padding:12px;font-weight:600;cursor:pointer;}
/* ================= lingua e allergeni ================= */
[hidden]{display:none !important;}
.topfix{display:flex;align-items:center;}
.topfix .chipbar{flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);}
.tools{display:flex;gap:6px;flex:0 0 auto;position:relative;padding:0 12px 0 2px;}
.tools.float{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:35;padding:0;}
[data-style=lavagna] .tools.float{top:calc(18px + env(safe-area-inset-top,0px));right:18px;}
[data-style=osteria] .tools.float{top:calc(22px + env(safe-area-inset-top,0px));}
.tool{height:34px;min-width:34px;padding:0 9px;border-radius:17px;border:1px solid var(--cardline);background:var(--card);color:var(--accent);box-shadow:var(--shadow);
  display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12px;letter-spacing:.02em;cursor:pointer;}
.tool svg{width:17px;height:17px;flex:0 0 auto;}
.tool .tn{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--card);font-size:11px;display:inline-flex;align-items:center;justify-content:center;}
.tool:focus-visible,.algbtn:focus-visible,.langmenu button:focus-visible,.ash button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
[data-style=elegante] .tool{border-radius:2px;box-shadow:none;border-color:var(--line);}
[data-style=osteria] .tool{border-radius:3px;border:2px solid var(--accent);box-shadow:0 2px 0 rgba(0,0,0,.12);}
[data-style=lavagna] .tool{background:var(--bg);border:1.5px dashed var(--on);color:var(--on);box-shadow:none;}
[data-style=lavagna] .tool.on{border-style:solid;} [data-style=lavagna] .tool .tn{background:var(--on);color:var(--bg);}
[data-style=notte] .tool{border-color:var(--accent);box-shadow:0 0 12px var(--glow);}
.langmenu{position:absolute;top:calc(100% + 8px);right:0;z-index:70;min-width:164px;padding:6px;border-radius:14px;background:#fff;color:#1b2429;
  box-shadow:0 10px 30px rgba(0,0,0,.28);font-family:var(--fb);}
.tools:not(.float) .langmenu{right:12px;}
.langmenu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:none;background:none;color:inherit;padding:11px 12px;
  border-radius:9px;font-size:15px;text-align:left;cursor:pointer;}
.langmenu button[aria-checked=true]{font-weight:700;background:#eef3f5;}
.langmenu button span{color:#0A4F66;font-weight:700;}
/* numeri degli allergeni accanto al prodotto */
.alg{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle;margin-left:6px;line-height:1;}
.alg i{font:700 9.5px/1 var(--fb);font-style:normal;letter-spacing:0;text-transform:none;width:17px;height:17px;border-radius:50%;
  border:1.2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);opacity:.75;}
.alg i.hit{background:var(--accent);border-color:var(--accent);color:var(--card);opacity:1;}
[data-style=lavagna] .alg i{border-style:dashed;opacity:.9;}
[data-style=lavagna] .alg i.hit{background:var(--on);color:var(--bg);border-style:solid;}
[data-style=notte] .nc .alg{margin-left:0;}
[data-style=elegante] .ld-n .alg,[data-style=riviera] .c-name .alg{position:relative;top:-1px;}
.avoid{opacity:.36;transition:opacity .2s;}
.avoid .alg i.hit{opacity:1;}
/* pulsante in copertina */
.cv-extra{display:flex;justify-content:center;margin-top:12px;}
[data-style=lavagna] .cv-extra,[data-style=notte] .cv-extra{justify-content:flex-start;}
.algbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--on);background:transparent;color:var(--on);border-radius:20px;
  padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer;}
.algbtn svg{width:16px;height:16px;}
[data-style=elegante] .algbtn{border-radius:2px;}
[data-style=osteria] .algbtn{border-radius:3px;}
[data-style=lavagna] .algbtn{border:1.5px dashed var(--on);font-family:var(--fh);font-size:19px;padding:3px 14px;}
/* scheda degli allergeni (dal basso) */
.ash-back{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);}
.ash{position:fixed;left:0;right:0;bottom:0;z-index:81;max-width:560px;margin:0 auto;max-height:88dvh;overflow-y:auto;background:#fff;color:#1b2429;
  border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(0,0,0,.25);
  font-family:var(--fb);transform:translateY(100%);transition:transform .22s ease-out;}
.ash.open{transform:none;}
.ash h3{font-family:var(--fh);font-size:22px;color:#1b2429;}
.ash p{font-size:13.5px;line-height:1.45;color:#55656c;margin:6px 0 14px;}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.agrid button{display:flex;align-items:center;gap:9px;min-height:46px;border:1px solid #cfd8dc;background:#f5f8f9;color:#1b2429;border-radius:12px;
  padding:8px 10px;text-align:left;font-size:13.5px;line-height:1.2;cursor:pointer;}
.agrid button i{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;
  justify-content:center;font:700 11px/1 var(--fb);font-style:normal;}
.agrid button[aria-pressed=true]{background:#1b2429;border-color:#1b2429;color:#fff;}
.ash .count{font-weight:600;color:#1b2429;margin:14px 0 0;min-height:1.4em;}
.ash .acts{display:flex;gap:8px;margin-top:12px;}
.ash .acts button{flex:1;border-radius:12px;padding:13px;font-weight:600;font-size:14.5px;cursor:pointer;}
.ash .clr{border:1px solid #cfd8dc;background:#fff;color:#1b2429;}
.ash .ok{border:none;background:#1b2429;color:#fff;}
.ash .fine{font-size:12px;color:#61737a;margin:14px 0 0;}
.lb .cap .al{font-size:12.5px;font-weight:600;color:#0A4F66;margin-top:6px;}
/* ================= foto del locale in copertina ================= */
.cphoto{width:100%;max-width:520px;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--chip);box-shadow:var(--shadow);}
.cphoto img{width:100%;height:100%;object-fit:cover;display:block;}
.cphoto + .medal{margin-top:-78px;position:relative;box-shadow:0 0 0 5px var(--bg),0 2px 10px rgba(0,0,0,.15);}
[data-style=elegante] .cphoto{border-radius:2px;box-shadow:none;outline:1px solid var(--on);outline-offset:5px;margin:6px 0 4px;}
[data-style=elegante] .cphoto + .medal{margin-top:-52px;box-shadow:0 0 0 5px var(--bg);}
[data-style=osteria] .cphoto{border-radius:3px;border:5px solid var(--card);box-shadow:0 0 0 2px var(--accent),0 3px 0 2px rgba(0,0,0,.15);}
[data-style=osteria] .cphoto + .medal{margin-top:-70px;box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--on);}
[data-style=lavagna] .cphoto{max-width:none;border-radius:3px;border:8px solid #f3eee2;border-bottom-width:24px;transform:rotate(-1.4deg);
  box-shadow:0 8px 18px rgba(0,0,0,.35);background:#f3eee2;}
[data-style=notte] .cphoto{max-width:none;border-radius:18px;border:1px solid var(--accent);box-shadow:0 0 18px var(--glow);position:relative;}
[data-style=notte] .cphoto + .medal{margin:-46px 0 0 16px;box-shadow:0 0 0 4px var(--bg),0 0 16px var(--glow);}
.m-sfoglia .page .cover:has(.cphoto){justify-content:flex-start;}

/* ================= foto del locale come sfondo leggero ================= */
#bgphoto{position:fixed;inset:0;z-index:0;background:center/cover no-repeat;opacity:0;pointer-events:none;transition:opacity .35s;}
body.has-bg #bgphoto{opacity:.22;}
[data-style=notte] body.has-bg #bgphoto,[data-style=lavagna] body.has-bg #bgphoto{opacity:.3;}
[data-style=osteria] body.has-bg #bgphoto{opacity:.26;mix-blend-mode:multiply;}
/* "solo foto": la foto è la protagonista, niente colore del locale e niente decorazioni che la coprono */
body.bg-chiaro #bgphoto{opacity:.72 !important;mix-blend-mode:normal !important;filter:saturate(1.05);}
body.bg-chiaro #bgphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.42));}
body.bg-chiaro{background-image:none !important;}
[data-style=riviera] body.bg-chiaro .cover::before{display:none;}
[data-style=riviera] body.bg-chiaro .pagehead h2::after{display:none;}
[data-style=osteria] body.bg-chiaro .topfix,[data-style=osteria] body.bg-chiaro .botnav{background:linear-gradient(rgba(0,0,0,.55),transparent);}
body.bg-chiaro .cover h1,body.bg-chiaro .pagehead h2,body.bg-chiaro .place,body.bg-chiaro .covernote{text-shadow:0 1px 8px rgba(0,0,0,.45);}
body.has-bg #app{position:relative;z-index:1;}
body.has-bg .page,body.has-bg .flow,body.has-bg .tiles-wrap,body.has-bg .acc,body.has-bg .sect-view{background:transparent;}
/* pulsante delle demo: foto in alto / di sfondo */
.phswitch{display:inline-flex;gap:0;margin:14px auto 0;color:var(--on);border:1.5px solid var(--on);border-radius:22px;overflow:hidden;font-size:12.5px;font-weight:700;}
.cover .phswitch{align-self:center;}
.phswitch button{border:0;background:transparent;color:inherit;padding:7px 12px;font:inherit;cursor:pointer;}
.phswitch button.on{background:var(--on);color:var(--bg);}
[data-style=lavagna] .phswitch,[data-style=notte] .phswitch{align-self:flex-start;}

/* ================= menu in pausa (stagionale) ================= */
.pausa{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 24px;color:var(--on);position:relative;z-index:1;}
.pausa h1{font-family:var(--fh);font-size:34px;margin:10px 0 0;line-height:1.1;}
.pausa .place{margin:0;color:var(--on-soft);}
.pausa-big{font-family:var(--fh);font-size:26px;font-weight:700;margin:28px 0 0;max-width:320px;line-height:1.2;}
.pausa-when{margin:0;font-size:17px;color:var(--on-soft);}

/* ================= filtro allergeni: non indicati, nascondi ================= */
.unk{flex-wrap:wrap;outline:1.5px dashed currentColor;outline-offset:3px;border-radius:6px;}

const MESI = {it: ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],
  en: ['January','February','March','April','May','June','July','August','September','October','November','December'],

function mesiAperti(txt){
  let s = String(txt || '').toLowerCase().replace(/\bda(l)?\s+/g, '').replace(/\s+(a|al|fino a)\s+/g, '-');
  if (!s.trim()) return null;
  const num = w => { w = (w || '').trim(); const n = parseInt(w, 10); if (n >= 1 && n <= 12) return n;
    const i = MESI.it.findIndex(m => w.startsWith(m.slice(0, 3))); return i >= 0 ? i + 1 : 0; };
  const set = new Set();
  s.split(/,|;|\s+e\s+/).forEach(part => { const [a, b] = part.split('-').map(num); if (!a) return;
    if (!b) { set.add(a); return; } let m = a; for (let k = 0; k < 12; k++) { set.add(m); if (m === b) break; m = m % 12 + 1; } });
  return set.size ? set : null;
}

const norm = x => String(x ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();

function parseAlg(s){      // "1, 7" oppure "glutine, latte" -> [1, 7]
  const out = new Set();
  String(s || '').split(/[,;\/·+\n]|\s-\s|\se\s/).forEach(t => { t = norm(t); if (!t) return;
    const m = t.match(/^(\d{1,2})\b/);
    if (m) { const n = +m[1]; if (n >= 1 && n <= 14) out.add(n); return; }
    if (t.length < 3) return;

    if (i >= 0) out.add(i + 1); });

}

function readTab(tab){             // legge una scheda del foglio con uno <script>: nessun blocco del browser
  return new Promise((resolve, reject) => {
    const cb = 'mit_' + tab.replace(/\W/g,'') + '_' + Date.now(), el = document.createElement('script');
    const done = () => { clearTimeout(timer); try { delete window[cb]; } catch (e) {} el.remove(); };
    const timer = setTimeout(() => { done(); reject('timeout'); }, 9000);
    window[cb] = data => { done();
      if (!data || data.status === 'error' || !data.table) return reject('errore');
      const head = data.table.cols.map(c => norm(c.label));
      const rows = data.table.rows.map(r => (r.c || []).map(c => c ? String(c.f ?? c.v ?? '').trim() : ''));
      resolve(rows.map(r => Object.fromEntries(head.map((h,i) => [h, r[i] ?? ''])))); };
    el.onerror = () => { done(); reject('rete'); };
    el.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(tab)}&t=${Date.now()}`;
    document.head.appendChild(el);
  });
}

<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbyqnPE9ryeK9Ai75AzhLcbDWUKfTAxKh6iT-tmDAP0rzGmPkGc7vY_3GNrzRs99_TSj/exec";
  var boot = document.getElementById('mit-boot'), partito = false;
  var slug = ((new URLSearchParams(location.search)).get('c') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 60);
  var KEY = 'mit-cfg-' + slug;
  function messaggio(t) { document.querySelectorAll('body > *:not(#mit-boot):not(script)').forEach(function (e) { e.hidden = true; });
    boot.hidden = false; boot.innerHTML = t; }
  function parti(c) {
    if (partito) return; partito = true; boot.remove();
    window.MIT_CONFIG = { SHEET_ID: c.sheet, STYLE: c.stile, COLOR: c.colore, MODE: c.modo, LINGUE: c.lingue, LOGO: c.logo || '', LOGOMODO: c.logoModo || '' };
    var s = document.createElement('script'); s.textContent = document.getElementById('mit-main').textContent; document.body.appendChild(s);
  }
  function leggi() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function salva(c) { try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} }
  function togli() { try { localStorage.removeItem(KEY); } catch (e) {} }
  function jsonp(cb) {
    var nome = 'mitcfg_' + Date.now(), el = document.createElement('script'), fatto = false;
    function fine(r) { if (fatto) return; fatto = true; clearTimeout(t); try { delete window[nome]; } catch (e) {} el.remove(); cb(r); }
    var t = setTimeout(function () { fine(null); }, 9000);
    window[nome] = fine; el.onerror = function () { fine(null); };
    el.src = API + '?c=' + encodeURIComponent(slug) + '&callback=' + nome; document.head.appendChild(el);
  }
  if (!slug) return messaggio('Questo link del menu non è corretto.<br>Controlla di aver scansionato il QR giusto.');
  var salvato = leggi();
  if (salvato && salvato.ok && !salvato.sospeso) parti(salvato);          // apertura subito, con l'ultima configurazione salvata
  jsonp(function (c) {
    if (!c) { if (!partito) messaggio('Il menu non è raggiungibile in questo momento.<br>Riprova tra poco.'); return; }
    if (c.ok && c.sospeso) { togli(); return messaggio('Questo menu non è disponibile al momento.'); }
    if (!c.ok) { togli(); if (!partito) messaggio(c.errore === 'nonpronto' ? 'Il menu è in preparazione.<br>Torna a trovarci tra poco!' : 'Menu non trovato.<br>Controlla il link o il QR.'); return; }
    salva(c); parti(c);
  });
})();
